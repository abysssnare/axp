plugins { id 'com.android.application' }
android {
    namespace 'dev.axp.host'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.axp.host'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
// 无 dependencies：core 只用 java.*，UI 只用 android.* 与 org.json(内置)
